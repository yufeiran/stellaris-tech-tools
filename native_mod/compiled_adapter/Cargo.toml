[package]
name = "tte-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Experimental native technology source/graph compiler; no Python runtime"

[dependencies]
serde_json = "=1.0.150"
sha2 = "=0.10.9"
rusqlite = { version = "=0.32.1", features = ["bundled"] }
zip = { version = "=9.1.3", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
codegen-units = 1
